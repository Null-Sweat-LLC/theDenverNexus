name: CI
# Runs every project's checks on every PR, so a dependency bump in one
# workspace can't silently break another.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.11.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test2doc-playwright:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright Browsers
        working-directory: packages/test2doc-playwright
        run: pnpm playwright install --with-deps chromium

      - name: Build Test2Doc
        run: pnpm build:test2doc

      - name: Run Tests
        run: pnpm test:test2doc
        env:
          CI: true

      - name: Upload Screenshot Diffs
        if: failure()  # Only when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ github.run_number }}
          path: packages/test2doc-playwright/tests/expected-screenshots/*-diff.png
          retention-days: 30

  playwright-passkey-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        working-directory: packages/playwright-passkey-gen
        run: pnpm ci:test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-passkey-report-${{ github.run_number }}
          path: packages/playwright-passkey-gen/playwright-report/
          retention-days: 30

  test2doc-maestro:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:maestro

      - name: Build
        working-directory: packages/test2doc-maestro
        run: pnpm build

  test2doc-maestro-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/test2doc-maestro-demo
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Offline compares against the versions pinned by the installed Expo SDK,
      # so it fails on incompatible bumps but not on newly published patches.
      - name: Check Expo SDK Compatibility
        run: npx expo install --check
        env:
          CI: true
          EXPO_OFFLINE: 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Export Web Build
        run: npx expo export --platform web
        env:
          CI: true

  # Maestro e2e fans out to one runner per platform. Each uploads its
  # maestro-output, and demo-docs fans back in to generate docs from all three.
  e2e-web:
    needs: test2doc-maestro-demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/test2doc-maestro-demo
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Web Build
        run: npx expo export --platform web
        env:
          CI: true

      - name: Serve Web Build
        run: |
          npx expo serve --port 8081 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081 > /dev/null && exit 0; sleep 1; done
          cat serve.log
          exit 1

      - name: Run Maestro
        run: pnpm e2e:docs:web

      - name: Upload Maestro Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-web
          path: apps/test2doc-maestro-demo/maestro-output/web
          retention-days: 14

  e2e-android:
    needs: test2doc-maestro-demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/test2doc-maestro-demo
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          CI: true

      # Release bundles the JS into the APK, so no Metro server is needed.
      # The Expo template signs release builds with the debug keystore.
      - name: Build APK
        working-directory: apps/test2doc-maestro-demo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Run Maestro on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: apps/test2doc-maestro-demo
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            pnpm e2e:docs:android

      - name: Upload Maestro Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-android
          path: apps/test2doc-maestro-demo/maestro-output/android
          retention-days: 14

  e2e-ios:
    needs: test2doc-maestro-demo
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/test2doc-maestro-demo
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild
        run: npx expo prebuild --platform ios
        env:
          CI: true

      # Release bundles the JS into the app, so no Metro server is needed.
      - name: Build App
        run: |
          xcodebuild \
            -workspace ios/test2docmaestrodemo.xcworkspace \
            -scheme test2docmaestrodemo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Boot Simulator and Install App
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/test2docmaestrodemo.app

      - name: Run Maestro
        run: pnpm e2e:docs:ios

      - name: Upload Maestro Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-ios
          path: apps/test2doc-maestro-demo/maestro-output/ios
          retention-days: 14

  demo-docs:
    needs: [e2e-web, e2e-android, e2e-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Maestro Output
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-output-*
          path: maestro-artifacts

      - name: Place Maestro Output
        run: |
          rm -rf apps/test2doc-maestro-demo/maestro-output
          mkdir -p apps/test2doc-maestro-demo/maestro-output
          for platform in android ios web; do
            mv "maestro-artifacts/maestro-output-$platform" "apps/test2doc-maestro-demo/maestro-output/$platform"
          done

      - name: Build test2doc-maestro
        working-directory: packages/test2doc-maestro
        run: pnpm build

      - name: Generate Docs
        working-directory: apps/test2doc-maestro-demo-docs
        run: pnpm generate

      - name: Build Docs
        working-directory: apps/test2doc-maestro-demo-docs
        run: pnpm build

      - name: Upload Docs
        uses: actions/upload-artifact@v4
        with:
          name: test2doc-maestro-demo-docs
          path: |
            apps/test2doc-maestro-demo-docs/docs
            apps/test2doc-maestro-demo-docs/build
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test2doc-maestro
        working-directory: packages/test2doc-maestro
        run: pnpm build

      - name: Typecheck test2doc-docs
        working-directory: apps/test2doc-docs
        run: pnpm typecheck

      - name: Build test2doc-docs
        working-directory: apps/test2doc-docs
        run: pnpm build

      - name: Typecheck test2doc-maestro-demo-docs
        working-directory: apps/test2doc-maestro-demo-docs
        run: pnpm typecheck

      - name: Build test2doc-maestro-demo-docs
        working-directory: apps/test2doc-maestro-demo-docs
        run: pnpm build
