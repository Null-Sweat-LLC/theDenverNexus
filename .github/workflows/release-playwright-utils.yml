name: Release - playwright-utils
on:
  push:
    branches: [main]
    paths:
      - 'packages/playwright-utils/src/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Test2Doc
        run: pnpm build:test2doc

      - name: Run Tests
        run: pnpm test:playwright-utils

      - name: Build
        working-directory: packages/playwright-utils
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        working-directory: packages/playwright-utils
        run: |
          # Other workflows, like the docs deploy, can push to main while this
          # one runs, and semantic-release won't publish from a branch that is
          # behind the remote.
          git pull --ff-only origin main
          npx semantic-release
