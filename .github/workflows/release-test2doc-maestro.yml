name: Release - test2doc-maestro
on:
  push:
    branches: [main]
    paths:
      - 'packages/test2doc-maestro/src/**'
      - '!packages/test2doc-maestro/src/testUtils/**'
      - '!packages/test2doc-maestro/src/*.test.ts'
      - 'packages/test2doc-maestro/fonts/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:maestro

      - name: Build
        working-directory: packages/test2doc-maestro
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        working-directory: packages/test2doc-maestro
        run: |
          npx semantic-release
