name: Release - test2doc-playwright
on:
  push:
    branches: [main]
    paths:
      - 'packages/test2doc-playwright/src/**'
      - '!packages/test2doc-playwright/src/testsUtils/**'
      - '!packages/test2doc-playwright/src/*.test.ts'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright Browsers
        working-directory: packages/test2doc-playwright
        run: pnpm playwright install --with-deps chromium

      - name: Run Tests
        run: pnpm test:test2doc

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        working-directory: packages/test2doc-playwright
        run: |
          npx semantic-release