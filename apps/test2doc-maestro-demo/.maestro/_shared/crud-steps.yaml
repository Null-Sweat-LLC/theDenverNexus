appId: com.test2doc.maestrodemo
---
# Labels become the docs. A labeled runFlow is a section and any other labeled
# command is a numbered step. The label on an evalScript is written to the page
# as markdown, so it can be a paragraph or a :::tip / :::warning box. Use
# literal labels: Maestro does not resolve variables in most of them.
#
# A screenshot highlights the element that the labeled tapOn steps after it tap,
# marked with the step's number. So take the screenshot before the tap.
- runFlow: wait-for-app.yaml

- runFlow:
    label: Add a todo item
    commands:
      - evalScript:
          script: ${0}
          label: Open the app. Your todo list starts out empty.
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: add-before
      - tapOn:
          id: todo-input
          label: Tap the text field at the top of the screen.
      - inputText:
          text: Buy milk
          label: Type what you need to do.
      - pressKey:
          key: Enter
          label: Press **Enter** on the keyboard.
      - assertVisible: "☐ Buy milk"
      - evalScript:
          script: ${0}
          label: Your new item appears in the list with an empty checkbox (☐).
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: add-after
      - evalScript:
          script: ${0}
          label: |
            :::tip
            Repeat these steps to add as many items as you like.
            :::
      - runFlow:
          file: add-todo.yaml
          env:
            TITLE: Walk the dog
      - assertVisible: "☐ Walk the dog"

- runFlow:
    label: Mark a todo item as done
    commands:
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: done-before
      - tapOn:
          text: "☐ Buy milk"
          label: Tap the item you have finished.
      - assertVisible: "☑ Buy milk"
      - assertNotVisible: "☐ Buy milk"
      - evalScript:
          script: ${0}
          label: The checkbox is now checked (☑).
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: done-after

- runFlow:
    label: Mark a todo item as not done
    commands:
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: undone-before
      - tapOn:
          text: "☑ Buy milk"
          label: Tap the completed item again.
      - assertVisible: "☐ Buy milk"
      - assertNotVisible: "☑ Buy milk"
      - evalScript:
          script: ${0}
          label: The checkbox is empty again and the item is back on your list.
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: undone-after

- runFlow:
    label: Delete a todo item
    commands:
      - evalScript:
          script: ${0}
          label: |
            :::warning
            Deleting a todo item is permanent. There is no undo.
            :::
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: delete-before
      - tapOn:
          # iOS exposes the button as "Delete Buy milk", Android and web as "Delete"
          text: "Delete.*"
          rightOf: "☐ Buy milk"
          label: Tap **Delete** next to the item you want to remove.
      - assertNotVisible: "☐ Buy milk"
      - assertVisible: "☐ Walk the dog"
      - evalScript:
          script: ${0}
          label: The item is removed and the rest of your list stays as it was.
      - runFlow:
          file: screenshot.yaml
          env:
            NAME: delete-after
