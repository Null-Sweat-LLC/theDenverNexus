packages:
  - packages/*
  - apps/*
ignoredBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - msw
  - sharp
  - workerd
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - prisma
overrides:
  tar@=7.5.1: '>=7.5.2'
# semantic-release's analyzer and notes generator load the conventionalcommits
# preset from their own location, which otherwise finds commitlint's newer copy.
# Preset 10 needs conventional-changelog-writer 9, but they still use writer 8.
packageExtensions:
  '@semantic-release/commit-analyzer':
    dependencies:
      conventional-changelog-conventionalcommits: ^9.3.1
  '@semantic-release/release-notes-generator':
    dependencies:
      conventional-changelog-conventionalcommits: ^9.3.1
